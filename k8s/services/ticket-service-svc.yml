apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: support-prod
spec:
  selector:
    app: ticket-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: support-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer