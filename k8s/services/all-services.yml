apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: support-prod
spec:
  selector:
    app: ticket-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: support-service
  namespace: support-prod
spec:
  selector:
    app: support-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: support-prod
spec:
  selector:
    app: notification-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: support-prod
spec:
  selector:
    app: reporting-service
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: support-prod
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: support-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-db
  namespace: support-prod
spec:
  selector:
    app: ticket-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: support-prod
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: support-prod
spec:
  selector:
    app: grafana
  ports:
    - port: 3001
      targetPort: 3000
  type: ClusterIP
