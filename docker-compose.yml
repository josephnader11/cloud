
services:
  # ─── Databases ───────────────────────────
  ticket-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    networks:
      - support-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message Broker ───────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - support-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microservices ────────────────────────
  ticket-service:
    build:
      context: ./services/ticket-service
    environment:
      DB_HOST: ticket-db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      ticket-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - support-network

  support-service:
    build:
      context: ./services/support-service
    environment:
      TICKET_SERVICE_URL: http://ticket-service:5001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - ticket-service
      - rabbitmq
    networks:
      - support-network

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - support-network

  reporting-service:
    build:
      context: ./services/reporting-service
    environment:
      TICKET_SERVICE_URL: http://ticket-service:5001
    depends_on:
      - ticket-service
    networks:
      - support-network

  frontend:
    build:
      context: ./services/frontend
    networks:
      - support-network

  # ─── Monitoring ───────────────────────────
  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - support-network

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - support-network

networks:
  support-network:
    driver: bridge

volumes:
  ticket-db-data:
  grafana-data:
